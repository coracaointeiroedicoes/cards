name: Descompactar site
on:
  push:
    paths:
      - 'site-parte-*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          for z in site-parte-*.zip; do unzip -o "$z"; done
          git rm -q site-parte-*.zip
          git config user.name "coracaointeiroedicoes"
          git config user.email "coracaointeiroedicoes@users.noreply.github.com"
          git add -A
          git commit -m "Site novo de cards (137 cards)"
          git push
